<!doctype html>
<html lang="es" data-estilo="canal">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reservar mesa</title>
<meta name="description" content="Reservá tu mesa eligiendo el lugar en el plano del salón.">
<meta name="theme-color" content="#0C1720">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icono.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..800;1,6..96,400..800&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Sans:wght@400..700&family=Instrument+Serif:ital@0;1&display=swap">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/estilos.css">
<style>
body{padding-inline:0}
.barra-prueba{margin-inline:0}
.sitio{min-height:100vh;display:flex;flex-direction:column}
.ancho{width:100%;max-width:1240px;margin:0 auto;padding-inline:max(clamp(16px,4vw,48px),env(safe-area-inset-left)) max(clamp(16px,4vw,48px),env(safe-area-inset-right))}
.mono{font-family:var(--mono)}

/* barra superior */
.barra-sitio{display:flex;align-items:center;gap:14px;padding-block:18px;flex-wrap:wrap}
.monograma{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--e-ink);font-family:var(--e-display);font-style:var(--e-disp-estilo);font-weight:var(--e-disp-peso);font-size:21px;line-height:1}
.barra-sitio .marca{font:500 12px var(--mono);letter-spacing:.2em;text-transform:uppercase}
.barra-sitio .der{margin-left:auto;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.idiomas{display:flex;gap:2px}
.idiomas button{font:600 12px var(--mono);letter-spacing:.08em;padding:6px 8px;border-radius:999px;color:var(--e-muted)}
.idiomas button[aria-pressed="true"]{color:var(--e-ink);box-shadow:inset 0 0 0 1.5px var(--e-ink)}

/* portada */
.portada-sitio{position:relative;padding-block:clamp(28px,6vw,72px) clamp(40px,7vw,90px);display:grid;gap:22px;overflow:hidden;isolation:isolate}
.coord{font:500 12px var(--mono);letter-spacing:.22em;text-transform:uppercase;color:var(--e-muted);display:flex;gap:14px;flex-wrap:wrap}
.coord b{font-weight:500;color:var(--e-acc)}
.nombre{font-size:clamp(50px,14vw,210px);margin:0;display:grid;overflow-wrap:break-word;hyphens:auto}
.nombre span{display:block}
.nombre em{display:block;font-style:italic;color:var(--e-acc);padding-left:clamp(24px,8vw,160px)}
:root[data-estilo="palermo"] .nombre em{font-style:normal}
:root[data-estilo="galeria"] .nombre em{font-style:normal;padding-left:0;-webkit-text-stroke:2px var(--e-ink);color:transparent}
.lema{font-family:var(--e-display);font-style:italic;font-size:clamp(20px,2.6vw,30px);line-height:1.25;max-width:26ch;color:var(--e-ink-2);text-wrap:balance}
:root[data-estilo="galeria"] .lema{font-family:var(--e-body);font-style:normal;font-weight:500;font-size:clamp(18px,2vw,22px)}
.portada-pie{display:flex;flex-wrap:wrap;gap:14px 26px;align-items:center;margin-top:6px}
.portada-pie .boton{padding:15px 26px;font-size:16px}
.dato{display:grid;gap:2px}
.dato span{font:500 11px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--e-muted)}
.dato b{font-family:var(--e-display);font-style:var(--e-disp-estilo);font-weight:var(--e-disp-peso);font-size:24px;line-height:1.1}
:root[data-estilo="galeria"] .dato b{font-stretch:70%;text-transform:uppercase}
.lineas{position:absolute;right:-4%;bottom:-6%;width:min(760px,80%);height:auto;z-index:-1;opacity:.55;pointer-events:none}
.lineas path{fill:none;stroke:var(--e-acc-2);stroke-width:1.2}
@media (prefers-reduced-motion:no-preference){ .lineas g{animation:deriva 18s ease-in-out infinite alternate} }
@keyframes deriva{to{transform:translateX(-40px)}}

/* marquesina de la carta */
.marquesina{border-block:1px solid var(--e-line-2);overflow:hidden;white-space:nowrap;padding-block:16px}
.pista{display:inline-flex;gap:40px;padding-left:40px;font-family:var(--e-display);font-style:var(--e-disp-estilo);font-weight:var(--e-disp-peso);font-size:clamp(22px,3vw,34px);letter-spacing:var(--e-disp-track);text-transform:var(--e-disp-mayus)}
:root[data-estilo="galeria"] .pista{font-stretch:66%}
.pista i{font-style:normal;color:var(--e-acc)}
@media (prefers-reduced-motion:no-preference){ .pista{animation:corre 38s linear infinite} }
@keyframes corre{to{transform:translateX(-50%)}}

/* la reserva */
.reservar{padding-block:clamp(40px,7vw,90px)}
.reservar-grid{display:grid;grid-template-columns:minmax(0,.78fr) minmax(0,1.22fr);gap:clamp(24px,5vw,72px);align-items:start}
.reservar-cab{position:sticky;top:24px;display:grid;gap:14px}
.reservar-cab h2{font-size:clamp(44px,6.4vw,86px)}
.reservar-cab p{color:var(--e-ink-2);max-width:36ch}
.progreso{display:flex;flex-wrap:wrap;gap:4px 16px;font:500 12px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--e-muted);margin-top:6px}
.progreso span.on{color:var(--e-ink);text-decoration:underline;text-decoration-color:var(--e-acc);text-decoration-thickness:2px;text-underline-offset:6px}
.progreso span.hecho{color:var(--e-acc)}
.panel-reserva{display:grid;gap:34px}
.pregunta{display:grid;gap:14px;padding-top:16px;border-top:1px solid var(--e-line-2)}
.pregunta h3{display:flex;gap:14px;align-items:baseline;font-family:var(--e-display);font-style:var(--e-disp-estilo);font-weight:var(--e-disp-peso);font-size:clamp(26px,3vw,36px);letter-spacing:var(--e-disp-track);text-transform:var(--e-disp-mayus)}
:root[data-estilo="galeria"] .pregunta h3{font-stretch:66%}
.pregunta h3 .rom{font:500 13px var(--mono);letter-spacing:.14em;color:var(--e-acc);font-style:normal;text-transform:none}
.dias{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;scrollbar-width:thin;scroll-snap-type:x mandatory}
.dia{flex:none;scroll-snap-align:start;width:74px;padding:12px 6px 10px;border-radius:18px;border:1.5px solid var(--e-line-2);display:grid;gap:4px;justify-items:center;text-align:center}
.dia small{font:500 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--e-muted)}
.dia b{font-family:var(--e-display);font-weight:var(--e-disp-peso);font-size:32px;line-height:1}
.dia[aria-pressed="true"]{background:var(--e-ink);color:var(--e-bg);border-color:var(--e-ink)}
.dia[aria-pressed="true"] small{color:var(--e-bg);opacity:.8}
.dia:disabled{opacity:.35;cursor:not-allowed}
.personas{display:flex;flex-wrap:wrap;align-items:center;gap:12px 22px}
.personas b{font-family:var(--e-display);font-weight:var(--e-disp-peso);font-size:clamp(52px,8vw,96px);line-height:.85;min-width:1.1em;text-align:center;font-variant-numeric:lining-nums}
.personas button{width:52px;height:52px;border-radius:50%;border:1.5px solid var(--e-ink);font-size:24px}
.personas button:hover{background:var(--e-ink);color:var(--e-bg)}
.personas span{color:var(--e-muted)}
.horas{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.horas .chip{font:600 15px var(--mono);padding:11px 6px}
.pol{background:var(--e-surf-2);border-radius:18px;padding:16px 18px;font-size:15px;line-height:1.55;color:var(--e-ink-2)}
.pol b{color:var(--e-ink)}
.resumen{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:baseline;justify-content:space-between}
.resumen b{font-family:var(--e-display);font-style:var(--e-disp-estilo);font-weight:var(--e-disp-peso);font-size:24px}
.leyenda-e{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--e-ink-2)}
.leyenda-e i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.mesa-info{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 14px;align-items:baseline;border-top:1px solid var(--e-line-2);padding-top:12px}
.mesa-info b{font-family:var(--e-display);font-style:var(--e-disp-estilo);font-weight:var(--e-disp-peso);font-size:28px}
.ticket{--r:7px;background:var(--e-surf);padding:26px 22px;display:grid;gap:9px;font-family:var(--mono);font-size:14px;
  -webkit-mask:radial-gradient(var(--r) at 50% 0,#0000 98%,#000) 50% 0/calc(2*var(--r) + 7px) 51% repeat-x,radial-gradient(var(--r) at 50% 100%,#0000 98%,#000) 50% 100%/calc(2*var(--r) + 7px) 51% repeat-x;
  mask:radial-gradient(var(--r) at 50% 0,#0000 98%,#000) 50% 0/calc(2*var(--r) + 7px) 51% repeat-x,radial-gradient(var(--r) at 50% 100%,#0000 98%,#000) 50% 100%/calc(2*var(--r) + 7px) 51% repeat-x}
.ticket .cod{font-size:34px;font-weight:600;letter-spacing:.16em;text-align:center;color:var(--e-acc)}
.ticket .l{display:flex;justify-content:space-between;gap:10px;border-top:1px dotted var(--e-line-2);padding-top:8px}
.ticket .l span{color:var(--e-muted)}
.listo-t{font-size:clamp(44px,6vw,76px)}
.pie-sitio{margin-top:auto;border-top:1px solid var(--e-line-2);padding-block:26px 40px;display:flex;flex-wrap:wrap;gap:10px 30px;justify-content:space-between;font-size:13.5px;color:var(--e-muted)}
.pie-sitio p{max-width:62ch}
@media (max-width:480px){
  .nombre em{padding-left:.35em}
  .portada-pie .boton{width:100%}
  .personas{gap:14px}
  .personas button{width:48px;height:48px}
  .dia{width:66px}
}
@media (min-width:1600px){ .ancho{max-width:1360px} }
@media (max-width:900px){
  .lineas{opacity:.25;bottom:-18%;width:110%}
  .reservar-grid{grid-template-columns:minmax(0,1fr)}
  .reservar-cab{position:static}
  .barra-sitio .der{margin-left:0;width:100%;justify-content:space-between}
}
</style>
</head>
<body>
<div class="sitio">
  <header class="barra-sitio ancho">
    <span class="monograma" id="monograma" aria-hidden="true">·</span><span class="marca" id="marca"></span>
    <div class="der">
      <div class="estilos" role="group" aria-label="Estilo de la página"><span data-t="estilo"></span>
        <button data-estilo="canal" style="--a:#0C1720;--b:#D6925F" title="Canal · Ushuaia de noche" aria-label="Estilo Canal"></button>
        <button data-estilo="bistro" style="--a:#F3EEE4;--b:#7A1F2B" title="Bistró · París" aria-label="Estilo Bistró"></button>
        <button data-estilo="palermo" style="--a:#0E231B;--b:#C9A45C" title="Palermo · Buenos Aires" aria-label="Estilo Palermo"></button>
        <button data-estilo="galeria" style="--a:#F6F6F2;--b:#2340D6" title="Galería · vanguardia" aria-label="Estilo Galería"></button></div>
      <div class="idiomas" role="group" aria-label="Idioma"><button data-l="es">ES</button><button data-l="en">EN</button><button data-l="pt">PT</button></div>
    </div>
  </header>

  <section class="portada-sitio ancho" aria-labelledby="nombreResto">
    <p class="coord"><span>Ushuaia</span><span>Tierra del Fuego</span><b>54°48′ S · 68°18′ O</b></p>
    <h1 class="disp nombre" id="nombreResto"><span>&nbsp;</span></h1>
    <p class="lema" id="lema"></p>
    <div class="portada-pie">
      <a class="boton pri" href="#reservar" data-t="cta"></a>
      <div class="dato"><span data-t="hoy_abre"></span><b id="horarioHoy">—</b></div>
      <div class="dato"><span data-t="reservas_hasta"></span><b id="anticipa">—</b></div>
    </div>
    <svg class="lineas" viewBox="0 0 760 320" aria-hidden="true"><g id="lineas"></g></svg>
  </section>

  <div class="marquesina" aria-label="Platos de la casa"><div class="pista" id="pista"></div></div>

  <section class="reservar ancho" id="reservar">
    <div class="reservar-grid">
      <div class="reservar-cab"><span class="coord" data-t="reservas"></span><h2 class="disp" data-t="titulo_h2"></h2><p data-t="sub_h2"></p><div class="progreso" id="progreso"></div></div>
      <main id="app" class="panel-reserva" aria-live="polite"><div class="muted">…</div></main>
    </div>
  </section>

  <footer class="pie-sitio ancho"><span id="pieWa"></span><p><span data-t="privacidad"></span> <a href="privacidad.html" data-t="ver_priv"></a></p><span data-t="hecho"></span></footer>
</div>
<script type="module" src="js/reservar.js"></script>
</body>
</html>
