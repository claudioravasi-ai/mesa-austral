<!doctype html>
<html lang="es" data-estilo="bosque">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reservar mesa</title>
<meta name="description" content="Reservá tu mesa eligiendo el lugar en el plano del salón.">
<meta name="theme-color" content="#16211A">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icono.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=DM+Sans:opsz,wght@9..40,300..700&family=Fraunces:ital,opsz,wght@0,9..144,500..900;1,9..144,500..900&family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Sans:wght@400..700&family=Instrument+Serif:ital@0;1&display=swap">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/estilos.css">
<link rel="stylesheet" href="css/movimiento.css">
<link rel="stylesheet" href="css/sitio.css">
<script src="js/abrir-desde-archivo.js"></script>
<script src="js/movimiento.js" defer></script>
</head>
<body>
<div class="sitio">
  <!-- barra de arriba: transparente sobre la portada, de papel al bajar -->
  <header class="barra-sitio" id="barra">
    <a class="logo-txt" href="#inicio" id="marca" aria-label="Inicio"></a>
    <span class="monograma" id="monograma" hidden aria-hidden="true">·</span>
    <div class="der">
      <a class="boton-mini" href="#reservar" data-t="cta_corta"></a>
      <button class="hamburguesa" id="abrirMenu" aria-expanded="false" aria-controls="menu" aria-label="Menú"><i></i><i></i></button>
    </div>
  </header>

  <!-- menú a pantalla completa -->
  <div class="menu" id="menu" hidden>
    <nav class="menu-links" aria-label="Secciones">
      <a href="#inicio"><small>01</small><span data-t="m_inicio"></span></a>
      <a href="#carta"><small>02</small><span data-t="m_carta"></span></a>
      <a href="#noche"><small>03</small><span data-t="m_noche"></span></a>
      <a href="#salon"><small>04</small><span data-t="m_salon"></span></a>
      <a href="#reservar"><small>05</small><span data-t="m_reservar"></span></a>
      <a href="#llegar"><small>06</small><span data-t="m_llegar"></span></a>
      <a href="#" id="menuMiReserva" hidden><small>✦</small><span data-t="m_mi"></span></a>
    </nav>
    <div class="menu-pie">
      <div class="estilos" role="group" aria-label="Estilo de la página"><span data-t="estilo"></span>
        <button data-estilo="bosque" style="--a:#24382B;--b:#B4532A" title="Bosque · nórdico fueguino" aria-label="Estilo Bosque"></button>
        <button data-estilo="canal" style="--a:#FF4F8B;--b:#3EE6C9" title="Aurora · la aurora austral" aria-label="Estilo Aurora"></button>
        <button data-estilo="bistro" style="--a:#F26A12;--b:#B0126B" title="Fuego · el fogón" aria-label="Estilo Fuego"></button>
        <button data-estilo="palermo" style="--a:#04241C;--b:#C8F53C" title="Lenga · el bosque fueguino" aria-label="Estilo Lenga"></button>
        <button data-estilo="galeria" style="--a:#3A2BFF;--b:#FF4FA3" title="Pop · glaciar pop" aria-label="Estilo Pop"></button></div>
      <div class="idiomas" role="group" aria-label="Idioma"><button data-l="es">ES</button><button data-l="en">EN</button><button data-l="pt">PT</button></div>
    </div>
  </div>

  <!-- puntos del costado: dónde estás -->
  <nav class="indice" id="indice" aria-label="Recorrido">
    <a href="#inicio" data-t-title="m_inicio"></a><a href="#carta" data-t-title="m_carta"></a><a href="#noche" data-t-title="m_noche"></a>
    <a href="#salon" data-t-title="m_salon"></a><a href="#reservar" data-t-title="m_reservar"></a><a href="#llegar" data-t-title="m_llegar"></a>
  </nav>

  <!-- 1 · portada: el canal a la hora real de Ushuaia -->
  <section class="portada-sitio" id="inicio" aria-labelledby="nombreResto">
    <div class="paisaje" id="paisaje" aria-hidden="true"></div>
    <div class="portada-txt">
      <p class="coord"><span>Ushuaia</span><span>Tierra del Fuego</span><b>54°48′ S · 68°18′ O</b></p>
      <span class="chapa" id="chapa" hidden><i aria-hidden="true"></i><span id="chapaT"></span></span>
      <h1 class="nombre" id="nombreResto"><span>&nbsp;</span></h1>
      <p class="lema" id="lema"></p>
      <div class="portada-pie">
        <a class="boton brillo" href="#reservar" id="ctaPortada"><span data-t="cta"></span> <span aria-hidden="true">→</span></a>
        <div class="dato"><span data-t="hoy_abre"></span><b id="horarioHoy">—</b></div>
        <div class="dato"><span data-t="reservas_hasta"></span><b id="anticipa">—</b></div>
      </div>
      <p class="momento" id="momento"></p>
    </div>
    <a class="baja" href="#carta"><span data-t="baja"></span><i aria-hidden="true"></i></a>
  </section>

  <div class="marquesina" aria-label="Platos de la casa"><div class="pista" id="pista"></div></div>

  <!-- 2 · la carta -->
  <section class="seccion" id="carta">
    <div class="sec-cab ancho" data-revela><span class="num-sec">02</span><h2 data-t="carta_t"></h2><p data-t="carta_p"></p></div>
    <div class="carta-pista" id="cartaPista"></div>
    <p class="carta-nota ancho" id="cartaNota" aria-live="polite"></p>
  </section>

  <!-- 3 · esta noche -->
  <section class="seccion oscura" id="noche">
    <div class="ancho">
      <div class="sec-cab" data-revela><span class="num-sec">03</span><h2 data-t="noche_t"></h2><p data-t="noche_p"></p></div>
      <div class="noche-grid">
        <article class="ficha" data-revela><span class="et" data-t="clima_t"></span><div class="clima" id="clima"><div class="cargando"></div></div></article>
        <article class="ficha" data-revela><span class="et" data-t="abre_t"></span><div id="abre"></div></article>
        <article class="ficha ancha" data-revela><span class="et" data-t="lugar_t"></span><div id="horasHoy"><div class="cargando"></div></div></article>
      </div>
    </div>
  </section>

  <!-- 4 · el salón -->
  <section class="seccion" id="salon">
    <div class="ancho salon-grid">
      <div class="sec-cab" data-revela><span class="num-sec">04</span><h2 data-t="salon_t"></h2><p data-t="salon_p"></p>
        <div class="salon-info" id="salonInfo" aria-live="polite"></div></div>
      <div data-revela><div class="plano-caja deslizable salon-plano" id="salonPlano"></div><p class="desliza-aviso" data-t="desliza"></p></div>
    </div>
  </section>

  <!-- 5 · la reserva -->
  <section class="reservar seccion ancho" id="reservar">
    <div class="reservar-grid">
      <div class="reservar-cab"><span class="num-sec">05</span><span class="coord" data-t="reservas"></span><h2 class="disp" data-t="titulo_h2"></h2><p data-t="sub_h2"></p><div class="progreso" id="progreso"></div>
        <div class="prefs" id="prefs" aria-live="polite"></div></div>
      <main id="app" class="panel-reserva" aria-live="polite"><div class="muted">…</div></main>
    </div>
  </section>

  <!-- 6 · cómo llegar -->
  <section class="seccion oscura" id="llegar">
    <div class="ancho llegar-grid">
      <div class="sec-cab" data-revela><span class="num-sec">06</span><h2 data-t="llegar_t"></h2><p data-t="llegar_p"></p>
        <div class="fila-h" style="margin-top:8px"><a class="boton pri" id="btnMapa" target="_blank" rel="noopener" data-t="mapa"></a><a class="boton" id="btnWa" target="_blank" rel="noopener" hidden>WhatsApp</a></div></div>
      <div class="mapa" data-revela aria-hidden="true"><svg viewBox="0 0 400 260" id="mapaSvg"></svg></div>
    </div>
  </section>

  <div class="cta-flota" id="ctaFlota"><a class="boton brillo" href="#reservar" data-t="cta"></a></div>

  <footer class="pie-sitio ancho"><span id="pieWa"></span><p><span data-t="privacidad"></span> <a href="privacidad.html" data-t="ver_priv"></a></p><span data-t="hecho"></span></footer>
</div>
<script type="module" src="js/reservar.js"></script>
</body>
</html>
